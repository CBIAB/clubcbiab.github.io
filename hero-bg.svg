<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080C18"/>
      <stop offset="100%" stop-color="#03060E"/>
    </linearGradient>
    <linearGradient id="fadeBottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="25%" stop-color="#080D18" stop-opacity="0"/>
      <stop offset="100%" stop-color="#080D18" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="fadeTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#080D18" stop-opacity="0.55"/>
      <stop offset="22%" stop-color="#080D18" stop-opacity="0"/>
    </linearGradient>
    <!-- Filtros neón naranja -->
    <filter id="neonO" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="18" result="b2"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="40" result="b3"/>
      <feMerge><feMergeNode in="b3"/><feMergeNode in="b2"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Filtros neón azul/blanco -->
    <filter id="neonB" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="15" result="b2"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="35" result="b3"/>
      <feMerge><feMergeNode in="b3"/><feMergeNode in="b2"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- FONDO -->
  <rect width="1200" height="800" fill="url(#bg)"/>

  <!-- ════════════════════════════════════ -->
  <!--   BALÓN DE BALONCESTO — NEÓN NARANJA  -->
  <!-- ════════════════════════════════════ -->
  <!-- cx=970 cy=195 r=160 — arriba derecha -->

  <!-- Capa 1: halo exterior difuso -->
  <g opacity="0.25">
    <circle cx="970" cy="195" r="160" fill="none" stroke="#FF6010" stroke-width="22"/>
    <path d="M 970 35 Q 1048 115 1048 195 Q 1048 275 970 355" fill="none" stroke="#FF6010" stroke-width="18"/>
    <path d="M 970 35 Q 892 115 892 195 Q 892 275 970 355" fill="none" stroke="#FF6010" stroke-width="18"/>
    <path d="M 810 195 Q 890 147 970 142 Q 1050 147 1130 195" fill="none" stroke="#FF6010" stroke-width="18"/>
    <path d="M 810 195 Q 890 243 970 248 Q 1050 243 1130 195" fill="none" stroke="#FF6010" stroke-width="18"/>
  </g>

  <!-- Capa 2: brillo medio -->
  <g opacity="0.5" filter="url(#neonO)">
    <circle cx="970" cy="195" r="160" fill="none" stroke="#FF7020" stroke-width="3.5"/>
    <path d="M 970 35 Q 1048 115 1048 195 Q 1048 275 970 355" fill="none" stroke="#FF7020" stroke-width="3"/>
    <path d="M 970 35 Q 892 115 892 195 Q 892 275 970 355" fill="none" stroke="#FF7020" stroke-width="3"/>
    <path d="M 810 195 Q 890 147 970 142 Q 1050 147 1130 195" fill="none" stroke="#FF7020" stroke-width="3"/>
    <path d="M 810 195 Q 890 243 970 248 Q 1050 243 1130 195" fill="none" stroke="#FF7020" stroke-width="3"/>
  </g>

  <!-- Capa 3: línea core brillante -->
  <g opacity="0.95">
    <circle cx="970" cy="195" r="160" fill="none" stroke="#FFA060" stroke-width="2"/>
    <path d="M 970 35 Q 1048 115 1048 195 Q 1048 275 970 355" fill="none" stroke="#FFA060" stroke-width="1.8"/>
    <path d="M 970 35 Q 892 115 892 195 Q 892 275 970 355" fill="none" stroke="#FFA060" stroke-width="1.8"/>
    <path d="M 810 195 Q 890 147 970 142 Q 1050 147 1130 195" fill="none" stroke="#FFB870" stroke-width="1.8"/>
    <path d="M 810 195 Q 890 243 970 248 Q 1050 243 1130 195" fill="none" stroke="#FFB870" stroke-width="1.8"/>
  </g>

  <!-- ════════════════════════════════════ -->
  <!--     SILBATO ÁRBITRO — NEÓN AZUL      -->
  <!-- ════════════════════════════════════ -->
  <!-- Posición: abajo izquierda, rotado -28° -->

  <!-- Capa 1: halo exterior -->
  <g transform="translate(215,615) rotate(-28)" opacity="0.22">
    <!-- Cuerpo -->
    <rect x="-88" y="-22" width="138" height="44" rx="22" fill="none" stroke="#38BDF8" stroke-width="20"/>
    <!-- Boquilla -->
    <rect x="50" y="-15" width="78" height="30" rx="8"  fill="none" stroke="#38BDF8" stroke-width="16"/>
    <!-- Anilla -->
    <circle cx="-80" cy="0" r="16" fill="none" stroke="#38BDF8" stroke-width="16"/>
    <!-- Agujero sonido -->
    <circle cx="-5"  cy="0" r="8"  fill="none" stroke="#38BDF8" stroke-width="12"/>
    <circle cx="20"  cy="0" r="8"  fill="none" stroke="#38BDF8" stroke-width="12"/>
  </g>

  <!-- Capa 2: brillo medio -->
  <g transform="translate(215,615) rotate(-28)" opacity="0.55" filter="url(#neonB)">
    <rect x="-88" y="-22" width="138" height="44" rx="22" fill="none" stroke="#38BDF8" stroke-width="3"/>
    <rect x="50"  y="-15" width="78"  height="30" rx="8"  fill="none" stroke="#38BDF8" stroke-width="2.5"/>
    <circle cx="-80" cy="0" r="16" fill="none" stroke="#38BDF8" stroke-width="2.5"/>
    <circle cx="-5"  cy="0" r="8"  fill="none" stroke="#38BDF8" stroke-width="2"/>
    <circle cx="20"  cy="0" r="8"  fill="none" stroke="#38BDF8" stroke-width="2"/>
    <!-- Separador cuerpo/boquilla -->
    <line x1="50" y1="-22" x2="50" y2="22" stroke="#38BDF8" stroke-width="1.5"/>
  </g>

  <!-- Capa 3: core brillante -->
  <g transform="translate(215,615) rotate(-28)" opacity="0.95">
    <rect x="-88" y="-22" width="138" height="44" rx="22" fill="none" stroke="#7DD8F8" stroke-width="1.8"/>
    <rect x="50"  y="-15" width="78"  height="30" rx="8"  fill="none" stroke="#7DD8F8" stroke-width="1.5"/>
    <circle cx="-80" cy="0" r="16" fill="none" stroke="#7DD8F8" stroke-width="1.8"/>
    <circle cx="-5"  cy="0" r="8"  fill="none" stroke="#A0E8FF" stroke-width="1.5"/>
    <circle cx="20"  cy="0" r="8"  fill="none" stroke="#A0E8FF" stroke-width="1.5"/>
    <line x1="50" y1="-20" x2="50" y2="20" stroke="#7DD8F8" stroke-width="1.2"/>
  </g>

  <!-- ════ ELEMENTOS GEOMÉTRICOS DE FONDO ════ -->
  <!-- Banda diagonal sutil -->
  <line x1="180" y1="800" x2="1200" y2="160" stroke="#F07020" stroke-width="1.2" opacity="0.3"/>
  <line x1="300" y1="800" x2="1200" y2="310" stroke="#F07020" stroke-width="0.6" opacity="0.15"/>
  <!-- Hexágonos fondo -->
  <polygon points="800,55 828,39 856,55 856,87 828,103 800,87"  fill="none" stroke="#F07020" stroke-width="0.9" opacity="0.18"/>
  <polygon points="856,55 884,39 912,55 912,87 884,103 856,87"  fill="none" stroke="#F07020" stroke-width="0.9" opacity="0.14"/>
  <polygon points="912,55 940,39 968,55 968,87 940,103 912,87"  fill="none" stroke="#F07020" stroke-width="0.9" opacity="0.1"/>
  <polygon points="828,103 856,87 884,103 884,135 856,151 828,135" fill="none" stroke="#F07020" stroke-width="0.7" opacity="0.1"/>
  <!-- Puntos -->
  <circle cx="490" cy="650" r="2.5" fill="#F07020" opacity="0.28"/>
  <circle cx="516" cy="650" r="2.5" fill="#F07020" opacity="0.2"/>
  <circle cx="542" cy="650" r="2.5" fill="#F07020" opacity="0.13"/>
  <circle cx="490" cy="676" r="2.5" fill="#F07020" opacity="0.2"/>
  <circle cx="516" cy="676" r="2.5" fill="#F07020" opacity="0.13"/>
  <circle cx="490" cy="702" r="2.5" fill="#F07020" opacity="0.13"/>

  <!-- FUNDIDOS -->
  <rect width="1200" height="800" fill="url(#fadeTop)"/>
  <rect width="1200" height="800" fill="url(#fadeBottom)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgMain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0F1E"/>
      <stop offset="100%" stop-color="#04080F"/>
    </linearGradient>
    <linearGradient id="slashOrange" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#F07020"/>
      <stop offset="60%" stop-color="#FF8C42"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="slashBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
    <radialGradient id="glowOrange" cx="75%" cy="20%" r="45%">
      <stop offset="0%" stop-color="#F07020" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#F07020" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="15%" cy="80%" r="40%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fadeBottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="35%" stop-color="#080D18" stop-opacity="0"/>
      <stop offset="100%" stop-color="#080D18" stop-opacity="0.97"/>
    </linearGradient>
    <linearGradient id="fadeTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#080D18" stop-opacity="0.5"/>
      <stop offset="22%" stop-color="#080D18" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur8">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="blur20">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <!-- ── FONDO BASE ── -->
  <rect width="1200" height="800" fill="url(#bgMain)"/>
  <rect width="1200" height="800" fill="url(#glowOrange)"/>
  <rect width="1200" height="800" fill="url(#glowBlue)"/>

  <!-- ── BANDA DIAGONAL PRINCIPAL (naranja) ── -->
  <!-- Capa glow/blur detrás -->
  <polygon points="180,800 460,800 1200,130 920,130" fill="url(#slashOrange)" opacity="0.18" filter="url(#blur20)"/>
  <!-- Banda sólida -->
  <polygon points="220,800 480,800 1200,170 940,170" fill="url(#slashOrange)" opacity="0.07"/>
  <!-- Línea brillante del borde superior -->
  <line x1="220" y1="800" x2="1200" y2="170" stroke="url(#slashOrange)" stroke-width="2.5" opacity="0.75"/>
  <!-- Línea brillante glow -->
  <line x1="220" y1="800" x2="1200" y2="170" stroke="#FF8C42" stroke-width="8" opacity="0.2" filter="url(#blur8)"/>
  <!-- Línea paralela secundaria -->
  <line x1="320" y1="800" x2="1200" y2="310" stroke="#F07020" stroke-width="1.2" opacity="0.3"/>
  <line x1="100" y1="800" x2="1080" y2="170" stroke="#F59E0B" stroke-width="0.8" opacity="0.2"/>

  <!-- ── BANDA DIAGONAL SECUNDARIA (azul, cruzada) ── -->
  <polygon points="0,200 280,0 420,0 0,350" fill="url(#slashBlue)" opacity="0.06"/>
  <line x1="0" y1="200" x2="420" y2="0" stroke="url(#slashBlue)" stroke-width="1.5" opacity="0.4"/>
  <line x1="0" y1="200" x2="420" y2="0" stroke="#0EA5E9" stroke-width="6" opacity="0.12" filter="url(#blur8)"/>
  <line x1="0" y1="280" x2="340" y2="0" stroke="#0EA5E9" stroke-width="0.8" opacity="0.2"/>

  <!-- ── DIAMANTE GRANDE (arriba derecha) ── -->
  <polygon points="1060,10 1195,155 1060,300 925,155" fill="none" stroke="#F07020" stroke-width="2" opacity="0.35"/>
  <polygon points="1060,10 1195,155 1060,300 925,155" fill="#F07020" opacity="0.04" filter="url(#blur20)"/>
  <polygon points="1060,45 1165,155 1060,265 955,155" fill="none" stroke="#F07020" stroke-width="1" opacity="0.2"/>
  <polygon points="1060,85 1135,155 1060,225 985,155" fill="none" stroke="#F59E0B" stroke-width="0.8" opacity="0.15"/>

  <!-- ── TRIÁNGULO (abajo izquierda, azul) ── -->
  <polygon points="0,480 320,800 0,800" fill="none" stroke="#0EA5E9" stroke-width="1.8" opacity="0.3"/>
  <polygon points="0,480 320,800 0,800" fill="url(#slashBlue)" opacity="0.05"/>
  <polygon points="0,560 220,800 0,800" fill="none" stroke="#0EA5E9" stroke-width="0.8" opacity="0.15"/>

  <!-- ── HEXÁGONOS (textura zona central-derecha) ── -->
  <polygon points="820,90 848,74 876,90 876,122 848,138 820,122"  fill="none" stroke="#F07020" stroke-width="1.2" opacity="0.22"/>
  <polygon points="876,90 904,74 932,90 932,122 904,138 876,122"  fill="none" stroke="#F07020" stroke-width="1.2" opacity="0.18"/>
  <polygon points="932,90 960,74 988,90 988,122 960,138 932,122"  fill="none" stroke="#F07020" stroke-width="1.2" opacity="0.14"/>
  <polygon points="848,138 876,122 904,138 904,170 876,186 848,170" fill="none" stroke="#F07020" stroke-width="1" opacity="0.15"/>
  <polygon points="904,138 932,122 960,138 960,170 932,186 904,170" fill="none" stroke="#F07020" stroke-width="1" opacity="0.12"/>
  <polygon points="820,186 848,170 876,186 876,218 848,234 820,218" fill="none" stroke="#F07020" stroke-width="0.8" opacity="0.1"/>
  <polygon points="876,186 904,170 932,186 932,218 904,234 876,218" fill="none" stroke="#F07020" stroke-width="0.8" opacity="0.08"/>

  <!-- ── LÍNEAS DE VELOCIDAD ── -->
  <line x1="-20" y1="720" x2="380" y2="420" stroke="#F07020" stroke-width="0.8" opacity="0.15"/>
  <line x1="-20" y1="680" x2="320" y2="410" stroke="#F07020" stroke-width="0.5" opacity="0.1"/>
  <line x1="30"  y1="760" x2="480" y2="440" stroke="#F07020" stroke-width="0.5" opacity="0.08"/>
  <line x1="600" y1="800" x2="1200" y2="450" stroke="#F07020" stroke-width="0.8" opacity="0.13"/>
  <line x1="680" y1="800" x2="1200" y2="520" stroke="#F07020" stroke-width="0.5" opacity="0.09"/>

  <!-- ── CURVAS DE BALÓN (abstracción, derecha) ── -->
  <path d="M 1100 0 Q 1160 180 1100 360"  fill="none" stroke="#F07020" stroke-width="2.5" opacity="0.3"/>
  <path d="M 1200 60 Q 1110 200 1200 340" fill="none" stroke="#F07020" stroke-width="2" opacity="0.22"/>
  <path d="M 880 190 Q 1050 140 1200 190" fill="none" stroke="#F07020" stroke-width="2" opacity="0.28"/>
  <path d="M 880 190 Q 1050 240 1200 190" fill="none" stroke="#F07020" stroke-width="2" opacity="0.28"/>

  <!-- ── PUNTOS EN CUADRÍCULA (zona media) ── -->
  <circle cx="520" cy="660" r="3" fill="#F07020" opacity="0.35"/>
  <circle cx="548" cy="660" r="3" fill="#F07020" opacity="0.26"/>
  <circle cx="576" cy="660" r="3" fill="#F07020" opacity="0.18"/>
  <circle cx="604" cy="660" r="3" fill="#F07020" opacity="0.12"/>
  <circle cx="632" cy="660" r="3" fill="#F07020" opacity="0.07"/>
  <circle cx="520" cy="688" r="3" fill="#F07020" opacity="0.26"/>
  <circle cx="548" cy="688" r="3" fill="#F07020" opacity="0.18"/>
  <circle cx="576" cy="688" r="3" fill="#F07020" opacity="0.12"/>
  <circle cx="604" cy="688" r="3" fill="#F07020" opacity="0.07"/>
  <circle cx="520" cy="716" r="3" fill="#F07020" opacity="0.18"/>
  <circle cx="548" cy="716" r="3" fill="#F07020" opacity="0.12"/>
  <circle cx="576" cy="716" r="3" fill="#F07020" opacity="0.07"/>

  <!-- Puntos azules (arriba izquierda) -->
  <circle cx="60"  cy="380" r="2.5" fill="#0EA5E9" opacity="0.3"/>
  <circle cx="88"  cy="380" r="2.5" fill="#0EA5E9" opacity="0.22"/>
  <circle cx="116" cy="380" r="2.5" fill="#0EA5E9" opacity="0.15"/>
  <circle cx="60"  cy="408" r="2.5" fill="#0EA5E9" opacity="0.22"/>
  <circle cx="88"  cy="408" r="2.5" fill="#0EA5E9" opacity="0.15"/>
  <circle cx="60"  cy="436" r="2.5" fill="#0EA5E9" opacity="0.15"/>

  <!-- ── RECTÁNGULO ROTADO (acento central) ── -->
  <rect x="580" y="340" width="80" height="80" fill="none" stroke="#F07020" stroke-width="1" opacity="0.18" transform="rotate(45 620 380)"/>
  <rect x="592" y="352" width="56" height="56" fill="none" stroke="#F59E0B" stroke-width="0.6" opacity="0.1" transform="rotate(45 620 380)"/>

  <!-- ── LÍNEA HORIZONTAL DIVISORA ── -->
  <line x1="0" y1="420" x2="1200" y2="420" stroke="#F07020" stroke-width="0.5" opacity="0.07"/>

  <!-- ── FUNDIDOS FINALES ── -->
  <rect width="1200" height="800" fill="url(#fadeTop)"/>
  <rect width="1200" height="800" fill="url(#fadeBottom)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="25%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#162036"/>
      <stop offset="100%" stop-color="#080D18"/>
    </radialGradient>
    <radialGradient id="ballGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F07020" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#F07020" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="courtGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F07020" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#F07020" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fadeBottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="45%" stop-color="#080D18" stop-opacity="0"/>
      <stop offset="100%" stop-color="#080D18" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="fadeTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#080D18" stop-opacity="0.55"/>
      <stop offset="28%" stop-color="#080D18" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeLeft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#080D18" stop-opacity="0.6"/>
      <stop offset="25%" stop-color="#080D18" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Fondo -->
  <rect width="1200" height="800" fill="url(#bg)"/>

  <!-- ══════ BALÓN (arriba derecha, parcialmente cortado) ══════ -->
  <circle cx="1030" cy="115" r="370" fill="url(#ballGlow)"/>
  <circle cx="1030" cy="115" r="230" fill="#0E1628" fill-opacity="0.6" stroke="#F07020" stroke-width="2.5" opacity="0.4"/>
  <!-- Costura horizontal superior -->
  <path d="M 800 115 Q 1030 -15 1260 115" fill="none" stroke="#F07020" stroke-width="2.2" opacity="0.38"/>
  <!-- Costura horizontal inferior -->
  <path d="M 800 115 Q 1030 245 1260 115" fill="none" stroke="#F07020" stroke-width="2.2" opacity="0.38"/>
  <!-- Costura vertical -->
  <line x1="1030" y1="-120" x2="1030" y2="360" stroke="#F07020" stroke-width="2" opacity="0.3"/>
  <!-- Costura curva izquierda -->
  <path d="M 895 -70 Q 940 115 895 300" fill="none" stroke="#F07020" stroke-width="1.5" opacity="0.2"/>
  <!-- Costura curva derecha -->
  <path d="M 1165 -70 Q 1120 115 1165 300" fill="none" stroke="#F07020" stroke-width="1.5" opacity="0.2"/>

  <!-- ══════ LÍNEAS DE CANCHA (abajo izquierda) ══════ -->
  <circle cx="185" cy="690" r="280" fill="url(#courtGlow)"/>
  <!-- Círculo central grande -->
  <circle cx="185" cy="690" r="250" fill="none" stroke="#F07020" stroke-width="1.5" opacity="0.1"/>
  <!-- Círculo central pequeño -->
  <circle cx="185" cy="690" r="78" fill="none" stroke="#F07020" stroke-width="1.5" opacity="0.14"/>
  <!-- Punto central -->
  <circle cx="185" cy="690" r="5" fill="#F07020" opacity="0.18"/>
  <!-- Línea de centro de cancha -->
  <line x1="-30" y1="690" x2="490" y2="690" stroke="#F07020" stroke-width="1" opacity="0.08"/>
  <!-- Arco de 3 puntos -->
  <path d="M -30 820 L -30 490 Q 5 270 185 250 Q 365 230 395 490 L 395 820" fill="none" stroke="#F07020" stroke-width="1.5" opacity="0.09"/>
  <!-- Zona de tiro libre (rectángulo) -->
  <rect x="60" y="560" width="250" height="260" fill="none" stroke="#F07020" stroke-width="1" opacity="0.07"/>
  <rect x="110" y="560" width="150" height="260" fill="none" stroke="#F07020" stroke-width="1" opacity="0.06"/>
  <!-- Línea tablero -->
  <line x1="60" y1="560" x2="310" y2="560" stroke="#F07020" stroke-width="2" opacity="0.1"/>

  <!-- ══════ SILUETA ÁRBITRO (izquierda, muy sutil) ══════ -->
  <!-- Cabeza -->
  <circle cx="88" cy="255" r="30" fill="none" stroke="#F07020" stroke-width="1.2" opacity="0.1"/>
  <!-- Torso -->
  <path d="M 58 288 L 42 415 L 134 415 L 118 288 Z" fill="none" stroke="#F07020" stroke-width="1.2" opacity="0.1"/>
  <!-- Rayas del árbitro -->
  <line x1="45" y1="318" x2="131" y2="318" stroke="#F07020" stroke-width="2" opacity="0.12"/>
  <line x1="43" y1="342" x2="133" y2="342" stroke="#F07020" stroke-width="2" opacity="0.12"/>
  <line x1="42" y1="366" x2="134" y2="366" stroke="#F07020" stroke-width="2" opacity="0.11"/>
  <!-- Brazo izquierdo -->
  <line x1="58" y1="305" x2="12" y2="360" stroke="#F07020" stroke-width="1.2" opacity="0.09" stroke-linecap="round"/>
  <!-- Brazo derecho levantado (señalando) -->
  <line x1="118" y1="300" x2="168" y2="265" stroke="#F07020" stroke-width="1.2" opacity="0.09" stroke-linecap="round"/>
  <!-- Silbato -->
  <circle cx="171" cy="262" r="5" fill="none" stroke="#F07020" stroke-width="1.2" opacity="0.12"/>
  <line x1="176" y1="262" x2="183" y2="259" stroke="#F07020" stroke-width="1.2" opacity="0.12"/>
  <!-- Piernas -->
  <line x1="66" y1="415" x2="50" y2="515" stroke="#F07020" stroke-width="1.2" opacity="0.08" stroke-linecap="round"/>
  <line x1="110" y1="415" x2="126" y2="515" stroke="#F07020" stroke-width="1.2" opacity="0.08" stroke-linecap="round"/>

  <!-- ══════ PUNTOS DECORATIVOS ══════ -->
  <circle cx="560" cy="640" r="2"   fill="#F07020" opacity="0.13"/>
  <circle cx="720" cy="700" r="1.5" fill="#F07020" opacity="0.1"/>
  <circle cx="870" cy="590" r="2"   fill="#F07020" opacity="0.11"/>
  <circle cx="460" cy="420" r="1.5" fill="#F07020" opacity="0.09"/>
  <circle cx="610" cy="310" r="2"   fill="#F07020" opacity="0.1"/>
  <circle cx="760" cy="460" r="1.5" fill="#F07020" opacity="0.09"/>
  <circle cx="380" cy="560" r="2"   fill="#F07020" opacity="0.1"/>
  <circle cx="920" cy="680" r="1.5" fill="#F07020" opacity="0.09"/>
  <circle cx="1050" cy="550" r="2"  fill="#F07020" opacity="0.1"/>
  <circle cx="640" cy="750" r="1.5" fill="#F07020" opacity="0.09"/>

  <!-- ══════ FUNDIDOS FINALES ══════ -->
  <rect width="1200" height="800" fill="url(#fadeTop)"/>
  <rect width="1200" height="800" fill="url(#fadeBottom)"/>
  <rect width="1200" height="800" fill="url(#fadeLeft)"/>
</svg>
